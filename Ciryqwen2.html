            position: absolute; top: 20px; left: 20px;

        .tool-btn.active { background: #3b82f6; border-color: #60a5fa; font-weight: bold; }

        .tool-btn.car-btn:hover { background: #059669; }
        
        .instructions { margin-top: 15px; font-size: 12px; color: #aaa; line-height: 1.5; }
        #stats {
            position: absolute; top: 20px; right: 20px; color: white;
            background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px;
            font-size: 14px; text-align: right;
