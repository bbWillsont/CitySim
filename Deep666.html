<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= Константы ================= */
const TILE = 2, COLS = 20, ROWS = 15;
const ROAD_SEG = 4;
const SKIRT_DEPTH = 0.1;
const COST = { road: 10, house: 120, school: 250 };
const TOOLS = [
  { id: 'road',     name: '🛣  Дорога', cost: COST.road },
  { id: 'house',    name: '🏠  Дом',    cost: COST.house },
  { id: 'school',   name: '🏫  Школа',  cost: COST.school },
  { id: 'bulldoze', name: '💣  Снести', cost: 0 },
];
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

/* Скорость и трафик */
const SPEED = 0.85;              // было 2.5
const MAX_CARS = 6;
const ROADS_PER_CAR = 4;
const LANE_OFFSET = 0.4;         // смещение в правую полосу
const MIN_CAR_GAP = 1.6;         // держим дистанцию
const BRAKE_FACTOR = 0.25;       // во сколько раз медленнее при торможении

/* Рельеф */
const ROAD_FLAT_R  = TILE * 0.62;
const ROAD_BLEND_R = TILE * 2.5;
const BUCKET_SIZE  = 4;

/* Throttle ценника */
const PULSE_THROTTLE_MS = 120;

/* ================= Состояние ================= */
const grid = new Array(COLS * ROWS).fill(null);
const idx = (x, y) => y * COLS + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;

let money = 1000, income = 0;
let tool = 'road', hover = null;
let cars = [], tickAcc = 0, carAcc = 0, trips = 0;
let roadDirty = false;

let dragging = false;
let previewStart = null;
let previewTiles = [];
let previewGroup = null;
let pending = null;

/* ================= Крестик «нет дороги» ================= */
let crossMaterial = null;
function getCrossMaterial() {
  if (crossMaterial) return crossMaterial;
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,60,60,0.95)';
  g.beginPath(); g.arc(32, 32, 28, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#ffffff'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(20, 20); g.lineTo(44, 44); g.moveTo(44, 20); g.lineTo(20, 44); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  crossMaterial = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false,
  });
  return crossMaterial;
}
function createCrossSprite() {
  const s = new THREE.Sprite(getCrossMaterial());
  s.scale.set(1.4, 1.4, 1);
  s.userData.bobPhase = Math.random() * Math.PI * 2;
  s.renderOrder = 999;
  return s;
}

/* ================= Координаты ================= */
function tileToWorld(x, y) {
  return new THREE.Vector3((x - COLS/2 + 0.5) * TILE, 0, (y - ROWS/2 + 0.5) * TILE);
}
function tileBaseXZ(x, y) {
  return { x: (x - COLS/2) * TILE, z: (y - ROWS/2) * TILE };
}
function worldToTile(p) {
  const x = Math.floor(p.x / TILE + COLS/2);
  const y = Math.floor(p.z / TILE + ROWS/2);
  return inBounds(x, y) ? { x, y } : null;
}

/* ================= Рельеф ================= */
function naturalHeight(wx, wz) {
  return Math.sin(wx * 0.06) * Math.cos(wz * 0.08) * 0.5
       + Math.sin(wx * 0.03 + wz * 0.05) * 0.4;
}

const roadTargets = new Map();
const roadBuckets = new Map();
const bucketKey = (bx, by) => bx * 1000 + by;

function buildRoadTargets() {
  roadTargets.clear();
  const list = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[idx(x, y)] === 'road') {
        const p = tileToWorld(x, y);
        roadTargets.set(idx(x, y), naturalHeight(p.x, p.z));
        list.push({ x, y });
      }
  for (let iter = 0; iter < 6; iter++) {
    const updates = new Map();
    for (const { x, y } of list) {
      let sum = 0, count = 0;
      for (const [dx, dy] of DIRS) {
        const nx = x+dx, ny = y+dy;
        if (inBounds(nx, ny) && grid[idx(nx, ny)] === 'road') {
          sum += roadTargets.get(idx(nx, ny)); count++;
        }
      }
      const cur = roadTargets.get(idx(x, y));
      updates.set(idx(x, y), count > 0 ? cur * 0.3 + (sum/count) * 0.7 : cur);
    }
    for (const [k, v] of updates) roadTargets.set(k, v);
  }
  roadBuckets.clear();
  for (const k of roadTargets.keys()) {
    const x = k % COLS, y = (k / COLS) | 0;
    const bx = Math.floor(x / BUCKET_SIZE), by = Math.floor(y / BUCKET_SIZE);
    const key = bucketKey(bx, by);
    if (!roadBuckets.has(key)) roadBuckets.set(key, []);
    roadBuckets.get(key).push({
      cx: (x - COLS/2 + 0.5) * TILE,
      cz: (y - ROWS/2 + 0.5) * TILE,
      targetY: roadTargets.get(k),
    });
  }
}

function influenceAt(wx, wz) {
  if (roadTargets.size === 0) return { W: 0, targetY: 0 };
  const R = ROAD_BLEND_R, R2 = R * R;
  const FLAT_R2 = ROAD_FLAT_R * ROAD_FLAT_R;
  const txf = wx / TILE + COLS/2 - 0.5, tyf = wz / TILE + ROWS/2 - 0.5;
  const bxMin = Math.floor((txf - R/TILE) / BUCKET_SIZE);
  const bxMax = Math.floor((txf + R/TILE) / BUCKET_SIZE);
  const byMin = Math.floor((tyf - R/TILE) / BUCKET_SIZE);
  const byMax = Math.floor((tyf + R/TILE) / BUCKET_SIZE);
  let W = 0, sumT = 0;
  for (let bx = bxMin; bx <= bxMax; bx++) {
    for (let by = byMin; by <= byMax; by++) {
      const bucket = roadBuckets.get(bucketKey(bx, by));
      if (!bucket) continue;
      for (const t of bucket) {
        const dx = wx - t.cx, dz = wz - t.cz;
        const d2 = dx*dx + dz*dz;
        if (d2 >= R2) continue;
        let w;
        if (d2 <= FLAT_R2) w = 1;
        else {
          const d = Math.sqrt(d2);
          const s = (R - d) / (R - ROAD_FLAT_R);
          w = s * s * (3 - 2 * s);
        }
        W += w; sumT += w * t.targetY;
      }
    }
  }
  return { W: Math.min(W, 1), targetY: W > 0 ? sumT / W : 0 };
}

function effectiveHeight(wx, wz) {
  const nat = naturalHeight(wx, wz);
  const inf = influenceAt(wx, wz);
  if (inf.W <= 0.001) return nat;
  return nat * (1 - inf.W) + inf.targetY * inf.W;
}

/* ================= Сцена ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2320);
scene.fog = new THREE.Fog(0x1b2320, 60, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 220);
camera.position.set(26, 30, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 10;
controls.maxDistance = 70;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };

/* ================= Свет ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(18, 28, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SH = 34;
sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH;
sun.shadow.camera.top  =  SH; sun.shadow.camera.bottom = -SH;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ================= Земля ================= */
const gw = (COLS + 8) * TILE, gh = (ROWS + 8) * TILE;
const GSEG = 4;
const groundGeo = new THREE.PlaneGeometry(gw, gh, (COLS + 8) * GSEG, (ROWS + 8) * GSEG);
groundGeo.rotateX(-Math.PI / 2);
const colorArr = new Float32Array(groundGeo.attributes.position.count * 3);
groundGeo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));

const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
ground.receiveShadow = true;
scene.add(ground);

function rebuildGround() {
  const pos = groundGeo.attributes.position;
  const col = groundGeo.attributes.color;
  for (let i = 0; i < pos.count; i++) {
    const wx = pos.getX(i), wz = pos.getZ(i);
    const nat = naturalHeight(wx, wz);
    const inf = influenceAt(wx, wz);
    const h = inf.W > 0.001 ? nat * (1 - inf.W) + inf.targetY * inf.W : nat;
    pos.setY(i, h);
    const ht = Math.min(1, Math.max(0, (h + 1.2) / 2.4));
    const grassR = 0.13 + ht * 0.13;
    const grassG = 0.20 + ht * 0.19;
    const grassB = 0.17 + ht * 0.11;
    const gb = Math.min(1, inf.W * 1.3);
    col.setXYZ(i,
      grassR * (1 - gb) + 0.36 * gb,
      grassG * (1 - gb) + 0.34 * gb,
      grassB * (1 - gb) + 0.30 * gb
    );
  }
  pos.needsUpdate = true; col.needsUpdate = true;
  groundGeo.computeVertexNormals();
}

/* ================= Сетка тайлов ================= */
let gridLineMesh = null;
function rebuildGridLines() {
  if (gridLineMesh) { scene.remove(gridLineMesh); gridLineMesh.geometry.dispose(); }
  const arr = [];
  const STEPS = 6;
  function addSeg(x1, z1, x2, z2) {
    for (let i = 0; i < STEPS; i++) {
      const a = i/STEPS, b = (i+1)/STEPS;
      const p1x = x1 + (x2-x1)*a, p1z = z1 + (z2-z1)*a;
      const p2x = x1 + (x2-x1)*b, p2z = z1 + (z2-z1)*b;
      arr.push(p1x, effectiveHeight(p1x, p1z) + 0.03, p1z,
               p2x, effectiveHeight(p2x, p2z) + 0.03, p2z);
    }
  }
  const halfW = COLS * TILE / 2, halfH = ROWS * TILE / 2;
  for (let x = 0; x <= COLS; x++) addSeg(-halfW + x*TILE, -halfH, -halfW + x*TILE, halfH);
  for (let y = 0; y <= ROWS; y++) addSeg(-halfW, -halfH + y*TILE, halfW, -halfH + y*TILE);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  gridLineMesh = new THREE.LineSegments(g,
    new THREE.LineBasicMaterial({ color: 0x4a6360, transparent: true, opacity: 0.55 }));
  scene.add(gridLineMesh);
}

/* ================= Подсветка ================= */
const highlight = new THREE.Mesh(
  new THREE.PlaneGeometry(TILE, TILE),
  new THREE.MeshBasicMaterial({ color: 0x5fd08a, transparent: true, opacity: 0.35, depthWrite: false })
);
highlight.rotation.x = -Math.PI / 2;
highlight.visible = false;
scene.add(highlight);

/* ================= Материалы ================= */
const MAT = {
  road:      new THREE.MeshLambertMaterial({ color: 0x4b5257 }),
  roadSkirt: new THREE.MeshLambertMaterial({ color: 0x3a4045, side: THREE.DoubleSide }),
  lane:      new THREE.MeshBasicMaterial({ color: 0xd9d16a }),
  house:     new THREE.MeshLambertMaterial({ color: 0xc46a45 }),
  roof:      new THREE.MeshLambertMaterial({ color: 0x8e4b2f }),
  school:    new THREE.MeshLambertMaterial({ color: 0x4a7fc9 }),
  window:    new THREE.MeshBasicMaterial({ color: 0xffe9b0 }),
};

/* ================= Логика сетки ================= */
function hasRoadAccess(x, y) {
  return DIRS.some(([dx, dy]) => {
    const nx = x+dx, ny = y+dy;
    return inBounds(nx, ny) && grid[idx(nx, ny)] === 'road';
  });
}

/* ================= Здания ================= */
const tileMeshes = new Map();

function removeTileMesh(x, y) {
  const m = tileMeshes.get(idx(x, y));
  if (!m) return;
  scene.remove(m);
  m.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material !== MAT.window && o.material !== MAT.house && o.material !== MAT.roof && o.material !== MAT.school) {
      o.material.dispose();
    }
  });
  tileMeshes.delete(idx(x, y));
}

function buildBuildingMesh(type, x, y) {
  const group = new THREE.Group();
  const p = tileToWorld(x, y);
  group.position.set(p.x, effectiveHeight(p.x, p.z), p.z);

  if (type === 'house') {
    const bodyMat = MAT.house.clone();
    const roofMat = MAT.roof.clone();
    const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.7, TILE*0.7, TILE*0.7), bodyMat);
    body.position.y = TILE*0.35;
    body.castShadow = body.receiveShadow = true;
    group.add(body);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.5, TILE*0.45, 4), roofMat);
    roof.position.y = TILE*0.7 + TILE*0.225;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    group.add(roof);

    const win = new THREE.Mesh(new THREE.PlaneGeometry(TILE*0.2, TILE*0.25), MAT.window);
    win.position.set(0, TILE*0.35, TILE*0.351);
    group.add(win);

    group.userData.bodyMat = bodyMat;
    group.userData.roofMat = roofMat;
  } else if (type === 'school') {
    const bodyMat = MAT.school.clone();
    const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.85, TILE*0.6, TILE*0.85), bodyMat);
    body.position.y = TILE*0.3;
    body.castShadow = body.receiveShadow = true;
    group.add(body);
    for (let i = 0; i < 3; i++) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(TILE*0.15, TILE*0.15), MAT.window);
      win.position.set((i - 1) * TILE*0.22, TILE*0.35, TILE*0.426);
      group.add(win);
    }
    group.userData.bodyMat = bodyMat;
    group.userData.roofMat = null;
  }

  if (!hasRoadAccess(x, y)) {
    const cross = createCrossSprite();
    const baseY = type === 'school' ? TILE * 1.0 : TILE * 1.5;
    cross.position.y = baseY;
    cross.userData.baseY = baseY;
    group.add(cross);
    group.userData.cross = cross;
    setBuildingNoRoadGlow(group, true);
  }

  scene.add(group);
  tileMeshes.set(idx(x, y), group);
}

function setBuildingNoRoadGlow(group, on) {
  const bodyMat = group.userData.bodyMat;
  const roofMat = group.userData.roofMat;
  if (!bodyMat) return;
  if (on) {
    bodyMat.emissive.setHex(0x661111);
    bodyMat.emissiveIntensity = 0.6;
    if (roofMat) { roofMat.emissive.setHex(0x440a0a); roofMat.emissiveIntensity = 0.5; }
  } else {
    bodyMat.emissive.setHex(0x000000);
    bodyMat.emissiveIntensity = 0;
    if (roofMat) { roofMat.emissive.setHex(0x000000); roofMat.emissiveIntensity = 0; }
  }
}

function updateBuildingHeights() {
  for (const [k, mesh] of tileMeshes) {
    const x = k % COLS, y = (k / COLS) | 0;
    const p = tileToWorld(x, y);
    mesh.position.set(p.x, effectiveHeight(p.x, p.z), p.z);
  }
}

function updateBuildingRoadStatus() {
  for (const [k, group] of tileMeshes) {
    const t = grid[k];
    if (t !== 'house' && t !== 'school') continue;
    const x = k % COLS, y = (k / COLS) | 0;
    const hasRoad = hasRoadAccess(x, y);
    const existing = group.userData.cross;

    if (!hasRoad && !existing) {
      const cross = createCrossSprite();
      const baseY = t === 'school' ? TILE * 1.0 : TILE * 1.5;
      cross.position.y = baseY;
      cross.userData.baseY = baseY;
      group.add(cross);
      group.userData.cross = cross;
      setBuildingNoRoadGlow(group, true);
    } else if (hasRoad && existing) {
      group.remove(existing);
      group.userData.cross = null;
      setBuildingNoRoadGlow(group, false);
    }
  }
}

/* ================= Дороги ================= */
let roadsMesh = null, skirtMesh = null, laneMesh = null;

function disposeMesh(m) {
  if (!m) return;
  scene.remove(m); m.geometry.dispose();
}

function rebuildRoads() {
  disposeMesh(roadsMesh);  roadsMesh = null;
  disposeMesh(skirtMesh);  skirtMesh = null;
  disposeMesh(laneMesh);   laneMesh = null;

  const list = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[idx(x, y)] === 'road') list.push({ x, y });
  if (!list.length) return;

  const topVerts = [], topIdx = [];
  const skirtVerts = [], skirtIdx = [];
  const laneVerts = [], laneIdx = [];
  const SEG = ROAD_SEG, LW = 0.09;

  for (const { x, y } of list) {
    const base = tileBaseXZ(x, y);
    const startV = topVerts.length / 3;
    for (let j = 0; j <= SEG; j++) {
      for (let i = 0; i <= SEG; i++) {
        const wx = base.x + (i/SEG) * TILE;
        const wz = base.z + (j/SEG) * TILE;
        topVerts.push(wx, effectiveHeight(wx, wz) + 0.04, wz);
      }
    }
    for (let j = 0; j < SEG; j++) {
      for (let i = 0; i < SEG; i++) {
        const a = startV + j*(SEG+1) + i;
        const b = a + 1, c = a + (SEG+1), d = c + 1;
        topIdx.push(a, c, b, b, c, d);
      }
    }

    const sides = [
      { dx: 0, dy: -1, axis: 'x', edge: 0 },
      { dx: 0, dy: 1,  axis: 'x', edge: TILE },
      { dx: -1, dy: 0, axis: 'z', edge: 0 },
      { dx: 1, dy: 0,  axis: 'z', edge: TILE },
    ];
    for (const s of sides) {
      const nx = x + s.dx, ny = y + s.dy;
      if (inBounds(nx, ny) && grid[idx(nx, ny)] === 'road') continue;
      for (let i = 0; i < SEG; i++) {
        const t1 = i/SEG, t2 = (i+1)/SEG;
        let p1x, p1z, p2x, p2z;
        if (s.axis === 'x') {
          p1x = base.x + t1*TILE; p1z = base.z + s.edge;
          p2x = base.x + t2*TILE; p2z = base.z + s.edge;
        } else {
          p1x = base.x + s.edge;  p1z = base.z + t1*TILE;
          p2x = base.x + s.edge;  p2z = base.z + t2*TILE;
        }
        const y1 = effectiveHeight(p1x, p1z) + 0.04;
        const y2 = effectiveHeight(p2x, p2z) + 0.04;
        const sv = skirtVerts.length / 3;
        skirtVerts.push(p1x, y1, p1z,  p2x, y2, p2z);
        skirtVerts.push(p1x, y1 - SKIRT_DEPTH, p1z,  p2x, y2 - SKIRT_DEPTH, p2z);
        skirtIdx.push(sv, sv+2, sv+1,  sv+1, sv+2, sv+3);
      }
    }

    const hasL = inBounds(x-1,y) && grid[idx(x-1,y)] === 'road';
    const hasR = inBounds(x+1,y) && grid[idx(x+1,y)] === 'road';
    const hasU = inBounds(x,y-1) && grid[idx(x,y-1)] === 'road';
    const hasD = inBounds(x,y+1) && grid[idx(x,y+1)] === 'road';

    if (hasL && hasR) {
      const pz = base.z + TILE/2;
      for (let i = 0; i < SEG; i++) {
        const t1 = i/SEG, t2 = (i+1)/SEG;
        const px1 = base.x + t1*TILE, px2 = base.x + t2*TILE;
        const y1 = effectiveHeight(px1, pz) + 0.06;
        const y2 = effectiveHeight(px2, pz) + 0.06;
        const lv = laneVerts.length / 3;
        laneVerts.push(px1, y1, pz - LW,  px2, y2, pz - LW);
        laneVerts.push(px1, y1, pz + LW,  px2, y2, pz + LW);
        laneIdx.push(lv, lv+2, lv+1,  lv+1, lv+2, lv+3);
      }
    }
    if (hasU && hasD) {
      const px = base.x + TILE/2;
      for (let i = 0; i < SEG; i++) {
        const t1 = i/SEG, t2 = (i+1)/SEG;
        const pz1 = base.z + t1*TILE, pz2 = base.z + t2*TILE;
        const y1 = effectiveHeight(px, pz1) + 0.06;
        const y2 = effectiveHeight(px, pz2) + 0.06;
        const lv = laneVerts.length / 3;
        laneVerts.push(px - LW, y1, pz1,  px - LW, y2, pz2);
        laneVerts.push(px + LW, y1, pz1,  px + LW, y2, pz2);
        laneIdx.push(lv, lv+2, lv+1,  lv+1, lv+2, lv+3);
      }
    }
  }

  {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(topVerts, 3));
    g.setIndex(topIdx); g.computeVertexNormals();
    roadsMesh = new THREE.Mesh(g, MAT.road);
    roadsMesh.receiveShadow = true;
    scene.add(roadsMesh);
  }
  if (skirtVerts.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(skirtVerts, 3));
    g.setIndex(skirtIdx); g.computeVertexNormals();
    skirtMesh = new THREE.Mesh(g, MAT.roadSkirt);
    skirtMesh.receiveShadow = true;
    scene.add(skirtMesh);
  }
  if (laneVerts.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(laneVerts, 3));
    g.setIndex(laneIdx); g.computeVertexNormals();
    laneMesh = new THREE.Mesh(g, MAT.lane);
    scene.add(laneMesh);
  }
}

/* ================= A* ================= */
function aStar(start, goal) {
  if (start.x === goal.x && start.y === goal.y) return [{ x: start.x, y: start.y }];
  if (!inBounds(start.x, start.y) || !inBounds(goal.x, goal.y)) return null;
  if (grid[idx(start.x, start.y)] !== 'road' || grid[idx(goal.x, goal.y)] !== 'road') return null;

  const k = (x, y) => y * COLS + x;
  const h = (x, y) => Math.abs(x - goal.x) + Math.abs(y - goal.y);
  const gScore = new Map(), cameFrom = new Map(), closed = new Set(), open = new Map();
  const sK = k(start.x, start.y);
  gScore.set(sK, 0);
  open.set(sK, { x: start.x, y: start.y, f: h(start.x, start.y) });

  while (open.size) {
    let bk = -1, bf = Infinity;
    for (const [kk, n] of open) if (n.f < bf) { bf = n.f; bk = kk; }
    const cur = open.get(bk); open.delete(bk);
    if (cur.x === goal.x && cur.y === goal.y) {
      const path = []; let ck = bk;
      while (ck !== undefined) {
        path.push({ x: ck % COLS, y: Math.floor(ck / COLS) });
        ck = cameFrom.get(ck);
      }
      return path.reverse();
    }
    closed.add(bk);
    const g = gScore.get(bk);
    for (const [dx, dy] of DIRS) {
      const nx = cur.x+dx, ny = cur.y+dy;
      if (!inBounds(nx, ny) || grid[idx(nx, ny)] !== 'road') continue;
      const nk = k(nx, ny);
      if (closed.has(nk)) continue;
      const tg = g + 1;
      if (tg < (gScore.get(nk) ?? Infinity)) {
        gScore.set(nk, tg); cameFrom.set(nk, bk);
        open.set(nk, { x: nx, y: ny, f: tg + h(nx, ny) });
      }
    }
  }
  return null;
}

/* ================= Трафик ================= */
const CAR_COLORS = [0xf2c14e, 0xe4572e, 0x76b5c5, 0xe8e8e8];

function roadTiles() {
  const r = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[idx(x, y)] === 'road') r.push({ x, y });
  return r;
}
function randomRoadTile() {
  const r = roadTiles();
  return r.length ? r[(Math.random() * r.length) | 0] : null;
}

function createCarMesh(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(TILE*0.35, TILE*0.22, TILE*0.6),
    new THREE.MeshLambertMaterial({ color })
  );
  body.position.y = TILE*0.11;
  body.castShadow = true;
  g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(TILE*0.28, TILE*0.15, TILE*0.3),
    new THREE.MeshLambertMaterial({ color: 0x222222 })
  );
  cabin.position.y = TILE*0.22;
  g.add(cabin);
  g.rotation.order = 'YXZ';
  return g;
}

function spawnCar() {
  const start = randomRoadTile();
  if (!start) return null;
  let best = null;
  for (let i = 0; i < 5; i++) {
    const end = randomRoadTile();
    if (!end || (end.x === start.x && end.y === start.y)) continue;
    const path = aStar(start, end);
    if (path && (!best || path.length > best.length)) best = path;
  }
  if (!best || best.length < 3) return null;
  const mesh = createCarMesh(CAR_COLORS[(Math.random()*CAR_COLORS.length)|0]);
  scene.add(mesh);
  return { path: best, pathIdx: 0, t: 0, mesh };
}

function assignNewJourney(c) {
  const cur = c.path[c.path.length - 1];
  let best = null;
  for (let i = 0; i < 5; i++) {
    const end = randomRoadTile();
    if (!end || (end.x === cur.x && end.y === cur.y)) continue;
    const path = aStar(cur, end);
    if (path && (!best || path.length > best.length)) best = path;
  }
  if (!best || best.length < 3) return false;
  c.path = best; c.pathIdx = 0; c.t = 0;
  return true;
}

function disposeCar(c) {
  scene.remove(c.mesh);
  c.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
}

function maintainCars() {
  cars = cars.filter(c => {
    if (!c.path || c.path.length < 2 ||
        !c.path.every(t => grid[idx(t.x, t.y)] === 'road')) {
      disposeCar(c); return false;
    }
    return true;
  });
  const target = Math.min(MAX_CARS, Math.floor(roadTiles().length / ROADS_PER_CAR));
  while (cars.length < target) {
    const car = spawnCar();
    if (!car) break;
    cars.push(car);
  }
}

/* ===== Позиция машины с учётом полосы ===== */
function computeCarPose(c) {
  const a = c.path[c.pathIdx];
  const b = c.path[c.pathIdx + 1] || a;
  const wa = tileToWorld(a.x, a.y), wb = tileToWorld(b.x, b.y);

  let dinX, dinZ;
  if (c.pathIdx > 0) {
    const prev = c.path[c.pathIdx - 1];
    const wp = tileToWorld(prev.x, prev.y);
    dinX = wa.x - wp.x; dinZ = wa.z - wp.z;
  } else { dinX = wb.x - wa.x; dinZ = wb.z - wa.z; }

  let doutX, doutZ;
  if (c.pathIdx + 2 < c.path.length) {
    const next = c.path[c.pathIdx + 2];
    const wn = tileToWorld(next.x, next.y);
    doutX = wn.x - wb.x; doutZ = wn.z - wb.z;
  } else { doutX = wb.x - wa.x; doutZ = wb.z - wa.z; }

  const inLen = Math.hypot(dinX, dinZ) || 1;
  const outLen = Math.hypot(doutX, doutZ) || 1;

  // Правая нормаль
  const rinX = -dinZ / inLen, rinZ = dinX / inLen;
  const routX = -doutZ / outLen, routZ = doutX / outLen;

  const laneAX = wa.x + rinX * LANE_OFFSET;
  const laneAZ = wa.z + rinZ * LANE_OFFSET;
  const laneBX = wb.x + routX * LANE_OFFSET;
  const laneBZ = wb.z + routZ * LANE_OFFSET;

  const x = laneAX + (laneBX - laneAX) * c.t;
  const z = laneAZ + (laneBZ - laneAZ) * c.t;

  const dx = laneBX - laneAX, dz = laneBZ - laneAZ;
  const len = Math.hypot(dx, dz) || 1;
  return { x, z, dx: dx / len, dz: dz / len };
}

function updateCarMeshPose(c) {
  const pose = computeCarPose(c);
  const a = c.path[c.pathIdx];
  const b = c.path[c.pathIdx + 1] || a;
  const wa = tileToWorld(a.x, a.y), wb = tileToWorld(b.x, b.y);
  const ya = effectiveHeight(wa.x, wa.z);
  const yb = effectiveHeight(wb.x, wb.z);
  const y = 0.12 + ya + (yb - ya) * c.t;

  c.mesh.position.set(pose.x, y, pose.z);
  c.mesh.rotation.y = Math.atan2(pose.dx, pose.dz);

  const horiz = Math.hypot(wb.x - wa.x, wb.z - wa.z) || 1;
  c.mesh.rotation.x = -Math.atan2(yb - ya, horiz);
}

function updateCars(dt) {
  if (!cars.length) return;
  const snap = cars.map(c => computeCarPose(c));

  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    const s = snap[i];
    let advance = dt * SPEED;

    // Car-following: ищем препятствие впереди на своей полосе
    let blocked = false;
    for (let j = 0; j < cars.length; j++) {
      if (i === j) continue;
      const o = snap[j];
      const rx = o.x - s.x, rz = o.z - s.z;
      const along = rx * s.dx + rz * s.dz;
      const perp = Math.abs(rx * s.dz - rz * s.dx);
      if (along > 0.01 && along < MIN_CAR_GAP && perp < 0.55) {
        blocked = true; break;
      }
    }
    if (blocked) advance *= BRAKE_FACTOR;

    c.t += advance;
    while (c.t >= 1 && c.pathIdx < c.path.length - 1) { c.t -= 1; c.pathIdx++; }
    if (c.pathIdx >= c.path.length - 1) {
      trips++;
      if (!assignNewJourney(c)) { disposeCar(c); cars.splice(i, 1); continue; }
    }
    updateCarMeshPose(c);
  }
}

/* ================= Превью / pending ================= */
function computeLineTiles(a, b) {
  const out = [];
  if (a.x === b.x && a.y === b.y) return [{ x: a.x, y: a.y }];
  const dx = b.x - a.x, dy = b.y - a.y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    for (let x = a.x; x !== b.x; x += Math.sign(dx)) out.push({ x, y: a.y });
    out.push({ x: b.x, y: a.y });
    for (let y = a.y; y !== b.y; y += Math.sign(dy)) out.push({ x: b.x, y });
  } else {
    for (let y = a.y; y !== b.y; y += Math.sign(dy)) out.push({ x: a.x, y });
    out.push({ x: a.x, y: b.y });
    for (let x = a.x; x !== b.x; x += Math.sign(dx)) out.push({ x, y: b.y });
  }
  return out;
}

function computeRoadLine(a, b) {
  const raw = computeLineTiles(a, b);
  const out = [];
  for (const t of raw) {
    const cur = grid[idx(t.x, t.y)];
    if (cur && cur !== 'road') break;
    out.push(t);
  }
  return out.length ? out : [{ x: a.x, y: a.y }];
}

function rebuildPreview() {
  if (previewGroup) {
    scene.remove(previewGroup);
    previewGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    previewGroup = null;
  }
  if (!previewTiles.length) return;
  previewGroup = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({
    color: 0x5fd08a, transparent: true, opacity: 0.5, depthWrite: false,
  });
  for (const t of previewTiles) {
    const p = tileToWorld(t.x, t.y);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(TILE * 0.95, TILE * 0.95), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(p.x, effectiveHeight(p.x, p.z) + 0.1, p.z);
    previewGroup.add(m);
  }
  scene.add(previewGroup);
}

function clearPreview() {
  if (previewGroup) {
    scene.remove(previewGroup);
    previewGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    previewGroup = null;
  }
  previewTiles = [];
}

/* ================= Ценник у курсора ================= */
const priceTagEl = document.getElementById('priceTag');
const priceTagInner = document.getElementById('priceTagInner');
let lastPriceText = null;
let lastPulseTime = 0;

function showPriceTag(cx, cy, text, cls) {
  const changed = lastPriceText !== text;
  priceTagInner.textContent = text;
  lastPriceText = text;
  priceTagEl.className = cls || '';
  if (changed) {
    const now = performance.now();
    if (now - lastPulseTime >= PULSE_THROTTLE_MS) {
      lastPulseTime = now;
      priceTagInner.classList.remove('pulse');
      void priceTagInner.offsetWidth;
      priceTagInner.classList.add('pulse');
    }
  }
  priceTagEl.style.display = 'block';
  positionPriceTag(cx, cy);
}
function hidePriceTag() {
  priceTagEl.style.display = 'none';
}
function positionPriceTag(cx, cy) {
  const b = priceTagEl.getBoundingClientRect();
  let left = cx + 16, top = cy + 16;
  if (left + b.width > innerWidth - 8) left = cx - b.width - 16;
  if (top + b.height > innerHeight - 8) top = cy - b.height - 16;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  priceTagEl.style.transform = `translate(${left}px, ${top}px)`;
}
function updatePriceTagForState(cx, cy) {
  if (pending || !hover) { hidePriceTag(); return; }

  if (tool === 'bulldoze') {
    const cur = grid[idx(hover.x, hover.y)];
    if (!cur) { hidePriceTag(); return; }
    showPriceTag(cx, cy, '+' + Math.floor(COST[cur] * 0.5) + ' ₡', 'income');
    return;
  }
  if (tool === 'road') {
    const tiles = dragging ? previewTiles : [hover];
    if (!tiles.length) { hidePriceTag(); return; }
    const newTiles = tiles.filter(t => !grid[idx(t.x, t.y)]);
    if (!dragging && !newTiles.length) { hidePriceTag(); return; }
    const cost = newTiles.length * COST.road;
    showPriceTag(cx, cy, cost + ' ₡', cost === 0 ? 'zero' : (money < cost ? 'negative' : ''));
    return;
  }
  if (tool === 'house' || tool === 'school') {
    if (grid[idx(hover.x, hover.y)]) { hidePriceTag(); return; }
    const cost = COST[tool];
    showPriceTag(cx, cy, cost + ' ₡', money < cost ? 'negative' : '');
    return;
  }
  hidePriceTag();
}

/* ================= Модалка ================= */
const confirmEl = document.getElementById('confirm');
const confirmTitleEl = document.getElementById('confirm-title');
const confirmCostEl = document.getElementById('confirm-cost');
const confirmOkBtn = document.getElementById('confirm-ok');
const confirmNoBtn = document.getElementById('confirm-no');

function pluralRu(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function showConfirm() {
  if (!pending) return;
  hidePriceTag();
  const toolInfo = TOOLS.find(t => t.id === pending.tool);
  confirmTitleEl.textContent = toolInfo.name.replace(/^\S+\s+/, '').trim();
  const cnt = pending.newTiles.length;
  confirmCostEl.innerHTML = `${pending.cost} ₡ <span>(${cnt} ${pluralRu(cnt, 'тайл', 'тайла', 'тайлов')})</span>`;
  confirmEl.style.display = 'block';
  updateConfirmPosition();
}

function updateConfirmPosition() {
  if (!pending) return;
  const a = pending.tiles[pending.tiles.length - 1];
  const p = tileToWorld(a.x, a.y);
  const v = new THREE.Vector3(p.x, effectiveHeight(p.x, p.z) + 1.6, p.z).project(camera);
  const sx = (v.x * 0.5 + 0.5) * innerWidth;
  const sy = (-v.y * 0.5 + 0.5) * innerHeight;
  const b = confirmEl.getBoundingClientRect();
  let left = sx + 22, top = sy - 10;
  if (left + b.width > innerWidth - 12) left = sx - b.width - 22;
  if (top + b.height > innerHeight - 12) top = innerHeight - b.height - 12;
  if (top < 12) top = 12;
  confirmEl.style.left = left + 'px';
  confirmEl.style.top = top + 'px';
}

function cancelPending() {
  pending = null;
  confirmEl.style.display = 'none';
  clearPreview();
}

function commitPending() {
  if (!pending) return;
  if (money < pending.cost) { log('Недостаточно средств'); cancelPending(); return; }
  money -= pending.cost;
  let roadChanged = false;
  for (const t of pending.newTiles) {
    grid[idx(t.x, t.y)] = pending.tool;
    if (pending.tool === 'road') {
      roadChanged = true;
    } else {
      buildBuildingMesh(pending.tool, t.x, t.y);
      if (!hasRoadAccess(t.x, t.y)) {
        log(`${pending.tool === 'house' ? 'Дом' : 'Школа'} без дороги — не приносит налог`);
      }
    }
  }
  cancelPending();
  if (roadChanged) {
    buildRoadTargets();
    rebuildRoads();
    rebuildGround();
    rebuildGridLines();
    updateBuildingHeights();
    updateBuildingRoadStatus();
    roadDirty = false;
  }
  updateHUD();
}
confirmOkBtn.addEventListener('click', () => commitPending());
confirmNoBtn.addEventListener('click', () => cancelPending());

/* ================= Bulldoze ================= */
function doBulldoze(x, y) {
  const i = idx(x, y), cur = grid[i];
  if (!cur) return;
  money += Math.floor(COST[cur] * 0.5);
  grid[i] = null;
  if (cur === 'road') {
    roadDirty = true;
  } else {
    removeTileMesh(x, y);
  }
  updateHUD();
}

/* ================= Экономика ================= */
function economyTick() {
  let inc = 0, upkeep = 0;
  const houses = [], schools = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const t = grid[idx(x, y)];
      if (t === 'house') houses.push({ x, y, acc: hasRoadAccess(x, y) });
      if (t === 'school') schools.push({ x, y, acc: hasRoadAccess(x, y) });
    }
  for (const h of houses) if (h.acc) inc += 8;
  for (const s of schools) {
    if (!s.acc) continue;
    upkeep += 6;
    for (const h of houses)
      if (h.acc && Math.abs(h.x-s.x) <= 2 && Math.abs(h.y-s.y) <= 2) inc += 3;
  }
  income = inc - upkeep; money += income;
  updateHUD();
}

/* ================= Пикинг ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const pickPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pickPoint = new THREE.Vector3();

function pickTile(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  let yPlane = 0;
  for (let i = 0; i < 4; i++) {
    pickPlane.constant = -yPlane;
    if (!raycaster.ray.intersectPlane(pickPlane, pickPoint)) return null;
    yPlane = effectiveHeight(pickPoint.x, pickPoint.z);
  }
  return worldToTile(pickPoint);
}

function moveHighlight(tile) {
  if (!tile) { highlight.visible = false; return; }
  const p = tileToWorld(tile.x, tile.y);
  highlight.position.set(p.x, effectiveHeight(p.x, p.z) + 0.09, p.z);
  highlight.visible = true;
}

/* ================= Ввод ================= */
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (pending) { cancelPending(); return; }
  const t = pickTile(e.clientX, e.clientY);
  if (!t) return;
  if (tool === 'bulldoze') { doBulldoze(t.x, t.y); return; }

  const existing = grid[idx(t.x, t.y)];
  if (tool !== 'road' && existing) return;
  if (tool === 'road' && existing && existing !== 'road') return;

  dragging = true;
  previewStart = t;
  previewTiles = [t];
  rebuildPreview();
  updatePriceTagForState(e.clientX, e.clientY);
});

renderer.domElement.addEventListener('pointermove', e => {
  const t = pickTile(e.clientX, e.clientY);
  hover = t;
  moveHighlight(t);
  if (dragging && previewStart && tool === 'road' && t) {
    previewTiles = computeRoadLine(previewStart, t);
    rebuildPreview();
  }
  updatePriceTagForState(e.clientX, e.clientY);
});

window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  hidePriceTag();
  if (!previewStart) return;
  const start = previewStart;
  previewStart = null;

  if (tool === 'road') {
    const newTiles = previewTiles.filter(t => !grid[idx(t.x, t.y)]);
    if (!newTiles.length) { clearPreview(); return; }
    pending = { tool: 'road', tiles: previewTiles.slice(), newTiles, cost: newTiles.length * COST.road };
  } else if (tool === 'house' || tool === 'school') {
    if (grid[idx(start.x, start.y)]) { clearPreview(); return; }
    pending = { tool, tiles: [start], newTiles: [start], cost: COST[tool] };
  } else { clearPreview(); return; }
  showConfirm();
});

renderer.domElement.addEventListener('pointerleave', () => {
  highlight.visible = false;
  hidePriceTag();
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (pending) cancelPending(); return; }
  const i = parseInt(e.key, 10) - 1;
  if (i >= 0 && i < TOOLS.length) selectTool(TOOLS[i].id);
});

/* ================= UI ================= */
const moneyEl = document.getElementById('money');
const incomeEl = document.getElementById('income');
const tripsEl = document.getElementById('trips');
const carsEl = document.getElementById('cars');
const logEl = document.getElementById('log');
const toolsEl = document.getElementById('tools');

function updateHUD() {
  moneyEl.textContent = Math.round(money) + ' ₡';
  moneyEl.style.color = money < 0 ? '#ff6b6b' : '#e8f0ea';
  incomeEl.textContent = (income >= 0 ? '+' : '') + income + ' ₡';
  incomeEl.style.color = income > 0 ? '#5fd08a' : income < 0 ? '#ff6b6b' : '#e8f0ea';
  tripsEl.textContent = trips;
  carsEl.textContent = cars.length;
}
function log(msg) {
  const l = document.createElement('div');
  l.textContent = msg;
  logEl.prepend(l);
  while (logEl.children.length > 4) logEl.lastChild.remove();
}
function selectTool(id) {
  if (pending) cancelPending();
  tool = id;
  [...toolsEl.children].forEach(b => b.classList.toggle('active', b.dataset.tool === id));
  hidePriceTag();
}
TOOLS.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t.name + (t.cost ? ` — ${t.cost} ₡` : '');
  b.dataset.tool = t.id;
  b.onclick = () => selectTool(t.id);
  toolsEl.appendChild(b);
});
selectTool('road');

/* ================= Старт ================= */
for (let x = 3; x <= 12; x++) grid[idx(x, 7)] = 'road';
for (let y = 4; y <= 10; y++) grid[idx(8, y)] = 'road';
grid[idx(6, 6)]  = 'house';
grid[idx(9, 6)]  = 'house';
grid[idx(11, 8)] = 'house';
grid[idx(5, 8)]  = 'house';
grid[idx(8, 9)]  = 'school';

buildRoadTargets();
rebuildRoads();
rebuildGround();
rebuildGridLines();
for (let y = 0; y < ROWS; y++)
  for (let x = 0; x < COLS; x++) {
    const t = grid[idx(x, y)];
    if (t === 'house' || t === 'school') buildBuildingMesh(t, x, y);
  }
updateHUD();

/* ================= Resize / loop ================= */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (roadDirty) {
    buildRoadTargets();
    rebuildRoads();
    rebuildGround();
    rebuildGridLines();
    updateBuildingHeights();
    updateBuildingRoadStatus();
    roadDirty = false;
  }

  controls.update();
  if (pending) updateConfirmPosition();

  // Покачивание крестиков + emissive-пульс
  const tSec = now * 0.001;
  for (const group of tileMeshes.values()) {
    const cross = group.userData.cross;
    if (!cross) continue;
    const phase = cross.userData.bobPhase;
    cross.position.y = cross.userData.baseY + Math.sin(tSec * 3 + phase) * 0.18;
    const bodyMat = group.userData.bodyMat;
    if (bodyMat) bodyMat.emissiveIntensity = 0.4 + 0.25 * (0.5 + 0.5 * Math.sin(tSec * 3 + phase));
    const roofMat = group.userData.roofMat;
    if (roofMat) roofMat.emissiveIntensity = 0.35 + 0.2 * (0.5 + 0.5 * Math.sin(tSec * 3 + phase));
  }

  updateCars(dt);
  tickAcc += dt;
  if (tickAcc >= 2) { tickAcc -= 2; economyTick(); }
  carAcc += dt;
  if (carAcc >= 0.5) { carAcc = 0; maintainCars(); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
